<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy mark">
  <!--
    OpenBuddy mark v15 - monochrome.
    Single-color version of openbuddy-logo.svg for embossing, single-ink
    print, watermarks, and dark/light auto-theming. Uses currentColor for
    the foreground so the host page controls the tint.
  -->
  <g fill="currentColor">
    <!-- Open ring (3/4 circle, gap at top-right) -->
    <path d="M 798.82 384.94 A 280 280 0 1 0 798.82 639.06"
          fill="none"
          stroke="currentColor"
          stroke-width="96"
          stroke-linecap="round"/>
    <!-- Companion sphere (Buddy spark) -->
    <circle cx="838" cy="298" r="68"/>
  </g>
</svg>
