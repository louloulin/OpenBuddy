<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy mark v4 - lavender palette.
    Original stylised geometric buddy companion. Lavender/indigo gradient on a
    deep navy badge — drops the green/teal palette in favour of cool tones.
    Composition unchanged from the prior buddy mark: rounded square head,
    splayed ears, ellipse muzzle, glowing eyes, heart nose, W-smile.
  -->
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="38%" r="70%">
      <stop stop-color="#1B1838"/>
      <stop offset=".55" stop-color="#0F0D24"/>
      <stop offset="1" stop-color="#070514"/>
    </radialGradient>
    <linearGradient id="fur" x1="280" y1="180" x2="760" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8E5FF"/>
      <stop offset=".4" stop-color="#C0BFFF"/>
      <stop offset="1" stop-color="#7A75E0"/>
    </linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8C85F0"/>
      <stop offset="1" stop-color="#4A4580"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="380" y1="560" x2="640" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6D3FF"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#C0BFFF"/>
      <stop stop-color="#1B1838" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bgRad)"/>
    <!-- ambient halos in lavender -->
    <circle cx="780" cy="220" r="340" fill="#C0BFFF" opacity=".14"/>
    <circle cx="220" cy="800" r="300" fill="#7A75E0" opacity=".10"/>
    <!-- background sparkle dots -->
    <circle cx="120" cy="180" r="2" fill="#E8E5FF" opacity=".55"/>
    <circle cx="900" cy="160" r="2.5" fill="#E8E5FF" opacity=".6"/>
    <circle cx="160" cy="880" r="1.8" fill="#E8E5FF" opacity=".5"/>
    <circle cx="880" cy="900" r="2.2" fill="#E8E5FF" opacity=".55"/>

    <!-- ears -->
    <path d="M256 248 Q300 158 388 220 Q360 372 296 416 Z" fill="url(#fur)"/>
    <path d="M768 248 Q724 158 636 220 Q664 372 728 416 Z" fill="url(#fur)"/>
    <!-- inner ear shadow -->
    <path d="M296 264 Q330 218 374 256 Q352 348 312 392 Z" fill="url(#furDark)" opacity=".7"/>
    <path d="M728 264 Q694 218 650 256 Q672 348 712 392 Z" fill="url(#furDark)" opacity=".7"/>

    <!-- head -->
    <rect x="276" y="276" width="472" height="472" rx="232" fill="url(#fur)"/>
    <!-- inner highlight -->
    <path d="M276 480 Q276 276 508 276 Q740 276 740 480" fill="none" stroke="#FFFFFF" stroke-width="6" opacity=".5"/>

    <!-- cream muzzle -->
    <ellipse cx="512" cy="640" rx="190" ry="124" fill="url(#muzzle)"/>

    <!-- brow spots -->
    <circle cx="392" cy="404" r="34" fill="#FFFFFF" opacity=".82"/>
    <circle cx="632" cy="404" r="34" fill="#FFFFFF" opacity=".82"/>

    <!-- eyes: glowing rings + dark core + sparkle -->
    <circle cx="412" cy="494" r="58" fill="url(#eyeGlow)"/>
    <circle cx="612" cy="494" r="58" fill="url(#eyeGlow)"/>
    <circle cx="412" cy="494" r="40" fill="#0F0D24"/>
    <circle cx="612" cy="494" r="40" fill="#0F0D24"/>
    <circle cx="424" cy="482" r="14" fill="#FFFFFF"/>
    <circle cx="624" cy="482" r="14" fill="#FFFFFF"/>
    <circle cx="408" cy="502" r="6" fill="#C0BFFF" opacity=".8"/>
    <circle cx="608" cy="502" r="6" fill="#C0BFFF" opacity=".8"/>

    <!-- heart-shaped nose -->
    <path d="M484 610 Q484 588 502 588 Q512 588 512 596 Q512 588 522 588 Q540 588 540 610 Q540 640 512 668 Q484 640 484 610 Z" fill="#0F0D24"/>

    <!-- smile -->
    <path d="M512 670 L512 706" stroke="#0F0D24" stroke-width="16" stroke-linecap="round"/>
    <path d="M512 706 Q470 752 432 716" fill="none" stroke="#0F0D24" stroke-width="16" stroke-linecap="round"/>
    <path d="M512 706 Q554 752 592 716" fill="none" stroke="#0F0D24" stroke-width="16" stroke-linecap="round"/>

    <!-- AI sparkle upper-right -->
    <g transform="translate(780 270)">
      <circle r="22" fill="#FFFFFF"/>
      <circle r="40" fill="none" stroke="#C0BFFF" stroke-width="5" opacity=".6"/>
      <circle r="58" fill="none" stroke="#C0BFFF" stroke-width="2" opacity=".3"/>
    </g>
  </g>
</svg>
