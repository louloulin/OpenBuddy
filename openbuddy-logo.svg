<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy mark v13 - abstract dog with brand teal accent.
    Original organic dog silhouette inspired by the user's reference aesthetic:
    white body + dark brown outline + teal accent. Recognizable as dog via
    triangular ears + snout + sitting posture. Single teal circle as the
    only "feature" — no eyes, nose, mouth. Pure shape + color storytelling.
  -->
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="50%" r="70%">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2EBDC"/>
    </radialGradient>
    <radialGradient id="body" cx="50%" cy="35%" r="70%">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FFFCF5"/>
      <stop offset="1" stop-color="#F0E5C8"/>
    </radialGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3D2A1A"/>
      <stop offset="1" stop-color="#1F140A"/>
    </linearGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bgRad)"/>

    <!-- left triangular ear (filled, organic) -->
    <path d="M280 320 L256 200 L320 232 L356 320 Z" fill="url(#body)" stroke="url(#outline)" stroke-width="14" stroke-linejoin="round"/>
    <!-- right triangular ear -->
    <path d="M744 320 L768 200 L704 232 L668 320 Z" fill="url(#body)" stroke="url(#outline)" stroke-width="14" stroke-linejoin="round"/>

    <!-- head dome -->
    <ellipse cx="512" cy="468" rx="280" ry="200" fill="url(#body)" stroke="url(#outline)" stroke-width="18"/>

    <!-- snout (lower rounded protrusion) -->
    <ellipse cx="512" cy="568" rx="140" ry="80" fill="url(#body)" stroke="url(#outline)" stroke-width="14"/>

    <!-- body: rounded teardrop -->
    <path d="M512 612
             Q280 612 244 760
             Q220 880 320 920
             Q420 952 512 952
             Q604 952 704 920
             Q 804 880 780 760
             Q 744 612 512 612 Z"
          fill="url(#body)" stroke="url(#outline)" stroke-width="18" stroke-linejoin="round"/>

    <!-- teal chest accent (the "feature" - replaces eyes/nose) -->
    <ellipse cx="512" cy="744" rx="120" ry="80" fill="#09C8A7" stroke="url(#outline)" stroke-width="14"/>

    <!-- teal inner detail: smaller offset circle for layering -->
    <ellipse cx="512" cy="744" rx="64" ry="44" fill="#0AA88C" opacity=".55"/>

    <!-- tiny paw nubs at bottom -->
    <ellipse cx="380" cy="950" rx="48" ry="20" fill="url(#body)" stroke="url(#outline)" stroke-width="14"/>
    <ellipse cx="644" cy="950" rx="48" ry="20" fill="url(#body)" stroke="url(#outline)" stroke-width="14"/>

    <!-- ear inner detail: small teal triangles -->
    <path d="M286 314 L296 248 L324 270 Z" fill="#09C8A7" opacity=".8"/>
    <path d="M738 314 L728 248 L700 270 Z" fill="#09C8A7" opacity=".8"/>

    <!-- tail: curved organic spike -->
    <path d="M780 760 Q840 720 856 660 Q860 632 836 624 Q816 624 808 660 Q800 696 740 720 Z"
          fill="url(#body)" stroke="url(#outline)" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
