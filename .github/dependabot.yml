# Dependabot configuration
# Keeps dependencies current and surfaces vulnerabilities.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "louloulin"
    labels:
      - "ci"
      - "chore"
    ignore:
      # moon 的原生二进制是 optionalDependency（@moonrepo/core-* 平台包）。
      #
      # 2026-10-26 的 CI 全红就是它引起的：dependabot 的分组 PR #65 把 moon
      # 2.5.4 升到 2.6.3，重新生成的 pnpm-lock.yaml 里 7 个平台包
      # **一个都没有**（npm 上 @moonrepo/cli@2.6.3 明明列了它们）。
      # lockfile 缺 → pnpm 不装 → moon CLI 启动时
      # require.resolve('@moonrepo/core-linux-x64-gnu/package.json') 抛错
      # → postinstall 退出码 1 → 所有 job 死在装包阶段，一行代码都没跑。
      #
      # dependabot 的 lockfile 重生成对 optional 平台包不可靠，所以这里
      # 直接不让它碰 moon。需要升级 moon 时人工改 package.json、用本机 pnpm
      # 重新生成锁文件，再跑 scripts/check-lockfile-platform-pkgs.mjs 确认。
      - dependency-name: "@moonrepo/cli"
      # vitest 2 → 5 是破坏性大版本：root vitest.config.ts 的
      # environmentMatchGlobs / reporter 在 v5 已改名或移除，
      # 且 --reporter=line 在 v5 也不是内置 reporter（nightly 连续红）。
      # 需要升级时人工评估并同步改配置。
      - dependency-name: "vitest"
      # ---- 以下是"大版本收敛"：major 一律人工评估 ----
      #
      # 2026-10-28 的判断：本仓的价值锚点是"门禁能跑"，不是"依赖最新"。
      # 一次 major 升级如果同时改动了 vitest 配置 / React 运行时 / 构建链，
      # 排查成本远高于它带来的收益。patch/minor（含安全补丁）继续自动流。
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "highlight.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "strnum"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express-rate-limit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "louloulin"
    labels:
      - "ci"
    ignore:
      # 同上：Actions 的 major 也走人工评估。原因是本仓的 CI 有两处
      # 非标准交互 —— package.json 的 packageManager 带 sha512 哈希
      # （pnpm/action-setup 对 version: 输入会直接报错），以及
      # checkout@v7 已是当前在用版本。自动升 major 等于在门禁还没绿过
      # 的时候改门禁本身。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/admin-portal"
    schedule:
      interval: "weekly"
    reviewers:
      - "louloulin"
    labels:
      - "ci"

  - package-ecosystem: "npm"
    directory: "/apps/admin-portal"
    schedule:
      interval: "weekly"
    reviewers:
      - "louloulin"
    labels:
      - "ci"
