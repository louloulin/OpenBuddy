name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Leave empty to build HEAD.'
        required: false
        type: string
      unsigned:
        description: 'Build without code signing / notarization (no Apple secrets needed).'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create the release as a draft (not published to the releases page).'
        required: false
        default: false
        type: boolean

# Cancel in-flight runs for the same tag/ref — only the latest build should
# race to populate a GitHub Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: OpenBuddy
  # The pnpm version is not pinned here: `pnpm/action-setup` reads
  # `packageManager` from the root package.json, and passing a `version:` input
  # as well throws "Multiple versions of pnpm specified" (it compares the input
  # to `packageManager` with plain string equality, so it can never match a
  # `11.24.0+sha512...` value).
  # The electron-builder wrapper pins the same version independently
  # (`scripts/electron-builder.sh` generates a `node_modules/.openbuddy-pnpm/pnpm`
  # shim so `app-builder-lib`'s pnpm collector — which requires pnpm ≥ 11 —
  # cannot silently downgrade via the proto PATH shim).

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          # 与 ci.yml 同一原因:moon 需要 main 的完整历史做 VCS 检测。
          fetch-depth: 0

      # A8(2026-10-19 生产评审):tag 必须与 package.json 版本一致,否则产物名
      # 与 release tag 漂移;workflow_dispatch 空 tag 会退化成分支名,在 main 上
      # 打出名为 "main" 的正式 Release —— 直接 fail。
      - name: Assert tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json version ${VERSION} — bump the version or fix the tag"
            exit 1
          fi

      - name: Require explicit tag for dispatch builds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "::error::workflow_dispatch requires an explicit tag input (refusing to publish a release named after a branch)"
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # moon owns the build DAG. `moon sync` regenerates the per-package
      # `.moon/<project>.yml` projections + `tsconfig.paths` from
      # `pnpm-workspace.yaml` so the toolchain is in sync with the install.
      - name: Sync moon workspace
        run: pnpm moon:sync

      # `pnpm typecheck` cascades to `app-desktop:typecheck` so electron
      # main + preload are covered as well as the renderer. `pnpm
      # workspace:typecheck` runs `*:typecheck` across every library
      # package in parallel — together they are the strongest type-level
      # gate before we commit to building the heavy electron-vite bundles.
      - name: Typecheck (renderer + electron main/preload)
        run: pnpm typecheck

      - name: Typecheck (workspace libraries)
        run: pnpm workspace:typecheck

      # Renderer + unit-test suite(C2,2026-10-19):测试现在全绿,发布不再
      # 对测试放行 —— 挂了就停,不带病发包。
      - name: Renderer tests
        run: pnpm test

      # electron-vite orchestrates three bundles (main + preload +
      # renderer) from a single config. We build it here so the platform
      # jobs inherit a consistent `out/` and only run electron-builder.
      - name: Build renderer + main + preload (electron-vite)
        run: pnpm build

  # Decide signed vs unsigned **before** the platform jobs.
  #
  # `git push origin v0.16.0` (the documented first-release command) fires the
  # `push` trigger, where `inputs.*` is null → every job took the *signed* path
  # and failed for anyone without Apple secrets. The first release is
  # deliberately unsigned, so a tag push without a signing certificate now
  # falls back to an unsigned **draft** release instead of going red.
  #
  # workflow_dispatch keeps full control: its `unsigned` / `draft` inputs win.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      unsigned: ${{ steps.mode.outputs.unsigned }}
      draft: ${{ steps.mode.outputs.draft }}
    steps:
      - name: Resolve build mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_UNSIGNED: ${{ inputs.unsigned }}
          DISPATCH_DRAFT: ${{ inputs.draft }}
          SIGNING_CERT: ${{ secrets.MACOS_CSC_LINK_BASE64 }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "unsigned=${DISPATCH_UNSIGNED:-false}" >> "$GITHUB_OUTPUT"
            echo "draft=${DISPATCH_DRAFT:-false}" >> "$GITHUB_OUTPUT"
          elif [ -n "$SIGNING_CERT" ]; then
            echo "unsigned=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MACOS_CSC_LINK_BASE64 is not set; building UNSIGNED artifacts and creating a DRAFT release."
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: [ci, resolve]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync moon workspace
        run: pnpm moon:sync

      # A6(2026-10-19 生产评审):host-core sidecar 必须随包构建 —— 此前没有任何
      # job 产出 crates/target/release/openbuddy-host-core.exe,打包要么失败要么
      # 发出一个能力被摘掉(权限/密钥/会话检索/审计静默降级)的 app。
      - name: Setup Rust toolchain (host-core sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Build host-core sidecar
        working-directory: crates
        run: cargo build --release

      # Builds the three electron-vite bundles first (cached from `ci`'s
      # build if the runner cached it; otherwise rebuilt locally) and then
      # runs electron-builder to produce `OpenBuddy-<version>-setup.exe`
      # + blockmap under `release/`.
      # unsigned 模式走 electron-builder.unsigned.yml:不签名,也不需要任何
      # 证书 secret。目的是"先让人拿到可安装的包",不是冒充正式发布。
      - name: Build Windows installer (electron-vite + electron-builder)
        if: ${{ needs.resolve.outputs.unsigned != 'true' }}
        run: pnpm electron:build:win
      - name: Build Windows installer (unsigned)
        if: ${{ needs.resolve.outputs.unsigned == 'true' }}
        run: pnpm electron:build:unsigned:win

      - name: List artifacts
        run: dir release\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          # `electron-builder.yml` flattens everything under `release/`.
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-macos:
    needs: [ci, resolve]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync moon workspace
        run: pnpm moon:sync

      # A6:host-core sidecar 随包构建(见 Windows job 注释)。
      - name: Setup Rust toolchain (host-core sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Build host-core sidecar
        working-directory: crates
        run: cargo build --release

      # Apple Developer ID Application certificate. Base64-encoded in
      # the secret; decoded to a tmp .p12 and pointed at via CSC_LINK +
      # CSC_KEY_PASSWORD so electron-builder picks it up.
      - name: Import macOS Developer ID certificate
        if: ${{ needs.resolve.outputs.unsigned != 'true' }}
        env:
          MACOS_CSC_LINK_BASE64: ${{ secrets.MACOS_CSC_LINK_BASE64 }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          test -n "$MACOS_CSC_LINK_BASE64"
          test -n "$MACOS_CSC_KEY_PASSWORD"
          printf '%s' "$MACOS_CSC_LINK_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id-application.p12"
          echo "CSC_LINK=$RUNNER_TEMP/developer-id-application.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"

      # App Store Connect API key for notarization. electron-builder reads
      # APPLE_API_KEY (path to .p8), APPLE_API_KEY_ID and APPLE_API_ISSUER.
      - name: Import App Store Connect notarization key
        if: ${{ needs.resolve.outputs.unsigned != 'true' }}
        env:
          MACOS_API_KEY_BASE64: ${{ secrets.MACOS_API_KEY_BASE64 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER: ${{ secrets.MACOS_API_ISSUER }}
        run: |
          test -n "$MACOS_API_KEY_BASE64"
          test -n "$MACOS_API_KEY_ID"
          test -n "$MACOS_API_ISSUER"
          printf '%s' "$MACOS_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$MACOS_API_KEY_ID.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_$MACOS_API_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$MACOS_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$MACOS_API_ISSUER" >> "$GITHUB_ENV"

      # Builds + signs + notarizes `OpenBuddy-<version>-{x64,arm64}.dmg`.
      # `pnpm electron:release:mac` gates on `scripts/check-macos-signing.
      # mjs`, which fails fast if the Developer ID / notary secrets above
      # are missing — the unsigned `electron.build.mac.dir` fallback lives
      # one task away for local iteration.
      - name: Build signed and notarized macOS DMG
        if: ${{ needs.resolve.outputs.unsigned != 'true' }}
        run: pnpm electron:release:mac
      - name: Build unsigned macOS DMG
        if: ${{ needs.resolve.outputs.unsigned == 'true' }}
        run: pnpm electron:build:unsigned:mac

      - name: List artifacts
        run: ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/latest-mac.yml

  build-linux:
    needs: [ci, resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # electron-builder's AppImage target needs libfuse2 (libfuse was
      # dropped from Ubuntu 22.04+) plus xvfb so it can run headlessly
      # on the runner. `--no-install-recommends` keeps the layer lean.
      - name: Install Linux AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync moon workspace
        run: pnpm moon:sync

      # A6:host-core sidecar 随包构建(见 Windows job 注释)。
      - name: Setup Rust toolchain (host-core sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Build host-core sidecar
        working-directory: crates
        run: cargo build --release

      # Builds the AppImage (`OpenBuddy-<version>-<arch>.AppImage`). No signing
      # step — AppImages are self-contained executables. Any Linux-
      # specific patches should land in `.github/actions/build-linux/`.
      - name: Build Linux AppImage (electron-vite + electron-builder)
        if: ${{ needs.resolve.outputs.unsigned != 'true' }}
        run: pnpm electron:build:linux
      - name: Build Linux AppImage (unsigned)
        if: ${{ needs.resolve.outputs.unsigned == 'true' }}
        run: pnpm electron:build:unsigned:linux

      - name: List artifacts
        run: ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/latest-linux.yml

  publish-release:
    needs: [build-windows, build-macos, build-linux, resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (CHANGELOG for release notes)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          sparse-checkout: |
            CHANGELOG.md
            scripts/extract-release-notes.mjs
            scripts/generate-checksums.mjs

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      # 生成 SHA256SUMS.txt 并挂到 release 上。
      #
      # 官网下载页要展示每个安装包的 SHA-256(P1-2 的验收标准)。GitHub
      # Releases API 不提供 release 资产的校验和,所以必须由发布流水线自己
      # 算。文件名用**发布资产名**(basename)—— 官网按资产名匹配。
      - name: Generate SHA256SUMS.txt
        run: node scripts/generate-checksums.mjs artifacts -o artifacts/SHA256SUMS.txt

      # Pulls the section for this tag out of CHANGELOG.md (if present)
      # and falls back to a generated commit list when the file hasn't
      # been updated yet. The output is consumed by `softprops/action-gh-
      # release` as the release body.
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
            set -euo pipefail
            TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
            # `scripts/extract-release-notes.mjs` 按 CHANGELOG 的真实标题层级
            # (H3) 匹配,并跳过段落里的历史里程碑小节;此前的内联 awk 写的是
            # `^## v`(H2),永远匹配不到,正文只能退化成提交列表。
            NOTES="$(node scripts/extract-release-notes.mjs "${TAG}" 2>/dev/null || true)"
            {
              echo "body<<RELEASE_NOTES_EOF"
              if [[ -n "$NOTES" ]]; then
                echo "$NOTES"
              else
                echo "（CHANGELOG.md 未包含 ${TAG} 段落，以下为自动生成的提交列表）"
                echo ""
              fi
              echo "RELEASE_NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "=== Release body for ${TAG} ==="
            echo "$NOTES" | head -20

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          # draft:true 时 release 不会出现在 releases 页面(只有拿到链接的人
          # 能看到)。unsigned 首版用它来"先产出可安装的包,再决定要不要公开"。
          draft: ${{ needs.resolve.outputs.draft == 'true' }}
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows-nsis/*.exe
            artifacts/windows-nsis/*.exe.blockmap
            artifacts/macos-dmg/*.dmg
            artifacts/macos-dmg/*.dmg.blockmap
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-appimage/latest-linux.yml
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
