name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: OpenBuddy

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Sync moon workspace
        run: pnpm moon:sync

      # `pnpm typecheck` runs `openbuddy:typecheck` which cascades to
      # `app-desktop:typecheck`. `pnpm workspace:typecheck` runs the wildcard
      # `*:typecheck` to fan out across the 17 library packages in parallel.
      - name: Typecheck all projects
        run: pnpm typecheck && pnpm workspace:typecheck

      - name: Test renderer
        run: pnpm test

      - name: Verify transformation-plan invariants (P0 closure guard)
        # `pnpm verify:plan` asserts that every P0 gap listed in
        # `docs/openbuddy-transformation-plan.html` still has its closure
        # evidence on disk. Running this here means a regression
        # (e.g. someone deletes scripts/_section-credit-expiry.sh or the
        # `check-macos-signing.mjs --verify` step) blocks the release
        # before any artifact is published.
        run: pnpm verify:plan

      - name: Build renderer + main + preload (electron-vite)
        run: pnpm build

  build-windows:
    needs: [ci]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Sync moon workspace
        run: pnpm moon:sync

      - name: Build Windows installer (electron-vite + electron-builder)
        run: pnpm electron:build:win

      - name: List artifacts
        run: ls release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: release/*.exe

  build-macos:
    needs: [ci]
    runs-on: macos-latest
    # OPENBUDDY_ALLOW_UNSIGNED_MAC=1 lets forks / PR builds skip notarization
    # so the job still produces a usable DMG even without Apple secrets. The
    # upload step still runs but flags the artifact as unsigned so consumers
    # downstream treat it accordingly.
    env:
      OPENBUDDY_ALLOW_UNSIGNED_MAC: ${{ vars.OPENBUDDY_ALLOW_UNSIGNED_MAC || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Sync moon workspace
        run: pnpm moon:sync

      - name: Import macOS Developer ID certificate
        id: import-cert
        env:
          MACOS_CSC_LINK_BASE64: ${{ secrets.MACOS_CSC_LINK_BASE64 }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${MACOS_CSC_LINK_BASE64:-}" ] || [ -z "${MACOS_CSC_KEY_PASSWORD:-}" ]; then
            if [ "${OPENBUDDY_ALLOW_UNSIGNED_MAC}" = "1" ]; then
              echo "::warning::MACOS_CSC_LINK_BASE64 / MACOS_CSC_KEY_PASSWORD not configured; macOS build will run without signing"
              echo "signed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::MACOS_CSC_LINK_BASE64 / MACOS_CSC_KEY_PASSWORD are required for signed macOS releases"
            exit 1
          fi
          printf '%s' "$MACOS_CSC_LINK_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id-application.p12"
          echo "CSC_LINK=$RUNNER_TEMP/developer-id-application.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"

      - name: Import App Store Connect notarization key
        id: import-notary
        env:
          MACOS_API_KEY_BASE64: ${{ secrets.MACOS_API_KEY_BASE64 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER: ${{ secrets.MACOS_API_ISSUER }}
        run: |
          if [ -z "${MACOS_API_KEY_BASE64:-}" ] || [ -z "${MACOS_API_KEY_ID:-}" ] || [ -z "${MACOS_API_ISSUER:-}" ]; then
            if [ "${OPENBUDDY_ALLOW_UNSIGNED_MAC}" = "1" ]; then
              echo "::warning::MACOS_API_KEY_* secrets not configured; notarization will be skipped"
              echo "notarized=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::MACOS_API_KEY_BASE64 / MACOS_API_KEY_ID / MACOS_API_ISSUER are required for notarized macOS releases"
            exit 1
          fi
          printf '%s' "$MACOS_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_$MACOS_API_KEY_ID.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_$MACOS_API_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$MACOS_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$MACOS_API_ISSUER" >> "$GITHUB_ENV"
          echo "notarized=1" >> "$GITHUB_OUTPUT"

      # Build macOS DMG. When OPENBUDDY_ALLOW_UNSIGNED_MAC=1 and signing
      # credentials are absent, electron-builder still runs in `--dir` mode
      # (skipping notarize); the resulting DMG is uploaded but clearly
      # flagged as unsigned.
      - name: Build macOS DMG (signed when secrets present, dir-only otherwise)
        run: |
          set -euo pipefail
          if [ "${{ steps.import-cert.outputs.signed }}" = "1" ] && [ "${{ steps.import-notary.outputs.notarized }}" = "1" ]; then
            echo "::notice::Building signed + notarized macOS DMG"
            pnpm electron:release:mac
          else
            echo "::warning::Building unsigned macOS DMG (OPENBUDDY_ALLOW_UNSIGNED_MAC=${OPENBUDDY_ALLOW_UNSIGNED_MAC})"
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm electron:build:mac.dir || true
            pnpm exec electron-builder --mac --dir --config electron-builder.yml
          fi

      - name: Verify signed macOS artifact
        if: ${{ steps.import-cert.outputs.signed == '1' && steps.import-notary.outputs.notarized == '1' }}
        # Run codesign -dv against the produced .app to confirm the signature
        # is a real Developer ID Application (not a self-signed / ad-hoc /
        # wrong-team identity). This is the post-build half of the signing
        # contract; preflight only verifies that the credentials exist.
        run: |
          set -euo pipefail
          APP_PATH=$(ls -d release/mac-*/OpenBuddy.app 2>/dev/null | head -n1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::no .app bundle produced under release/mac-*"
            exit 1
          fi
          node scripts/check-macos-signing.mjs --verify "${APP_PATH}"

      - name: Mark DMG as unsigned when secrets were skipped
        if: ${{ steps.import-cert.outputs.signed != '1' || steps.import-notary.outputs.notarized != '1' }}
        run: |
          echo "::warning::Uploading unsigned macOS DMG (no Apple Developer secrets configured)"
          if ls release/*.dmg 1>/dev/null 2>&1; then
            for dmg in release/*.dmg; do
              echo "::warning::${dmg} is unsigned — do not distribute"
            done
          fi

      - name: List artifacts
        run: ls release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: warn

  build-linux:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Sync moon workspace
        run: pnpm moon:sync

      # Linux 上不需要 macOS-only 的签名 / 公证步骤;
      # AppImage 本身就是自包含可执行文件,只需构建并产出 .AppImage 即可。
      # 任何 Linux-specific 的运行时 patch 应放在 .github/actions/build-linux/*。
      - name: Build Linux AppImage (electron-vite + electron-builder)
        run: pnpm electron:build:linux

      - name: List artifacts
        run: ls release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (CHANGELOG for release notes)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          sparse-checkout: |
            CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          NOTES=""
          if [[ -f CHANGELOG.md ]]; then
            NOTES="$(awk -v ver="## ${TAG#v}" '
              $0 ~ "^## v" {
                if (found) exit
                if (index($0, ver) == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md | sed '/^---$/d' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba} -e '}')"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [[ -n "$NOTES" ]]; then
              echo "$NOTES"
            else
              echo "（CHANGELOG.md 未包含 ${TAG} 段落，以下为自动生成的提交列表）"
              echo ""
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "=== Release body for ${TAG} ==="
          echo "$NOTES" | head -20

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows-nsis/*.exe
            artifacts/macos-dmg/*.dmg
            artifacts/linux-appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
