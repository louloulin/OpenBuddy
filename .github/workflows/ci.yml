name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: OpenBuddy

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # moon 的 VCS 变更检测需要 main 的历史(`git merge-base`)——
          # 浅克隆下直接 exit 128,typecheck/test 在跑任何任务前就挂。
          fetch-depth: 0

      # pnpm must exist before setup-node runs: `cache: pnpm` resolves the
      # store path via pnpm itself, so with the two steps the other way round
      # setup-node dies with "Unable to locate executable file: pnpm" and
      # every job fails at step 1.
      #
      # No `version:` input on purpose. action-setup compares it to
      # packageManager by plain string equality after stripping only the
      # `pnpm@` prefix, so `11.24.0` never equals `11.24.0+sha512...` from
      # package.json and it throws "Multiple versions of pnpm specified".
      # Left unset it installs packageManager verbatim, hash included — that
      # field in package.json is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 锁文件平台包守卫（只需要 lockfile，不需要装依赖）。
      #
      # 2026-10-26 的 CI 全红就是这么来的：dependabot 的分组 PR 把 moon
      # 升到 2.6.3 时重新生成的 pnpm-lock.yaml 把 7 个
      # @moonrepo/core-* 平台包整组丢了 → 安装期
      # `Cannot find module '@moonrepo/core-linux-x64-gnu/package.json'`
      # → postinstall 退出码 1 → 每个 job 都死在装包阶段。
      # 这个门禁在装包之前就把它拦下来。
      - name: Lockfile platform-package guard
        run: node scripts/check-lockfile-platform-pkgs.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      # 修复 node_modules 残骸。
      #
      # 本仓 2026-09 从 pnpm 的 isolated 链接器切到 hoisted。切换没有伴随
      # 一次干净的 node_modules 重建，于是包目录里留下了旧布局的失效符号
      # 链接和 stale `.bin` shim。shim 里的 cmd-shim-target 指向已不存在的
      # 包目录，`pnpm exec <bin>` 就会解析到坏路径而不是回落到仓库根：
      #   Error: Cannot find module '.../packages/<pkg>/node_modules/typescript/bin/tsc'
      # 这和 2026-10-26 那次 `Cannot find module '@moonrepo/core-linux-x64-gnu/...'`
      # 是同一类问题：node_modules 的实际状态与配置不一致，解析落到不存在的路径。
      - name: Repair node_modules layout
        run: node scripts/repair-node-modules.mjs

      # moon 的原生二进制是 optionalDependency 平台包。装不上时 `moon sync`
      # 会让整个 job 挂掉，而门禁本身并不需要它（见下面的 gate:typecheck）。
      # 所以这里允许失败，但把原因打印出来。
      - name: Sync moon workspace (best-effort)
        run: pnpm moon:sync || echo "::warning::moon sync 失败；门禁不依赖 moon 的原生二进制"

      # 门禁走纯 Node 实现（scripts/run-workspace-task.mjs）：读每个项目的
      # moon.yml 取出 typecheck task 的 command，在项目目录里执行。
      # 不依赖 moon 的原生二进制 —— 那个包一旦缺失，之前是「装都装不完，
      # 一行代码都跑不了」。
      - name: Typecheck all projects
        run: |
          pnpm gate:typecheck
          pnpm verify:agent-host-boundaries

      # Dictionary parity + ratcheting hardcoded-CJK gate. Separate from
      # typecheck because it needs no compiler: a new untranslated string or a
      # new hardcoded literal fails here even though every type is correct.
      - name: i18n consistency gate
        run: pnpm verify:i18n

      # Ratcheting hardcoded-color gate. Also compiler-free: a literal that
      # silently ignores dark mode is a theme bug that no type or unit test
      # will ever catch.
      - name: hardcoded color gate
        run: pnpm verify:colors

      # React hook-order gate (scripts/check-hook-order.mjs). 2026-10-14 生产
      # 事故:四处「提前 return 之后还有 hook」的组件在生产包抛 React #300
      # (rendered fewer hooks),dev 模式不复现。该模式编译器查不出、单测跑
      # 不红,只有静态 AST 门禁能拦。
      - name: hook order gate
        run: pnpm verify:hook-order

      # Accessibility gate. This cannot live in the `lint-tools` job: that job
      # is `continue-on-error: true` (it also runs Sheriff and Prettier, which
      # are report-only), so an a11y error there would block nothing. jsx-a11y
      # is enabled as errors in eslint.config.mjs and was previously gated on
      # exactly one rule, which let 210 keyboard-unreachable fake buttons
      # (`<span role="button" onClick>`) accumulate. No ratchet baseline here:
      # the debt is paid, so any new finding is a regression.
      - name: accessibility gate
        run: pnpm verify:a11y

      # IPC stub gate. The preload/main channel *parity* test only compares
      # channel sets, so `async () => null` is the cheapest way to pass it —
      # which is how "adopt email action items as tasks" ended up toasting
      # success while writing nothing, and how the unified-search task scope
      # stayed permanently empty. This gate reads the handler bodies: a channel
      # the UI calls that resolves to a stub, to nothing, or to an unregistered
      # channel fails here. Explicitly-removed channels must be declared with a
      # reason in scripts/ipc-stub-baseline.json.
      - name: IPC stub gate
        run: pnpm verify:ipc-stubs

  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # pnpm must exist before setup-node runs: `cache: pnpm` resolves the
      # store path via pnpm itself, so with the two steps the other way round
      # setup-node dies with "Unable to locate executable file: pnpm" and
      # every job fails at step 1.
      #
      # No `version:` input on purpose. action-setup compares it to
      # packageManager by plain string equality after stripping only the
      # `pnpm@` prefix, so `11.24.0` never equals `11.24.0+sha512...` from
      # package.json and it throws "Multiple versions of pnpm specified".
      # Left unset it installs packageManager verbatim, hash included — that
      # field in package.json is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Repair node_modules layout
        run: node scripts/repair-node-modules.mjs

      - name: Sync moon workspace (best-effort)
        run: pnpm moon:sync || echo "::warning::moon sync 失败；门禁不依赖 moon 的原生二进制"

      # 同 typecheck job：门禁用纯 Node 实现，不依赖 moon 的原生二进制。
      - name: Vitest
        run: pnpm gate:test

  storage-boundaries:
    name: Storage Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm storage:boundaries
      - run: pnpm storage:acceptance

  ipc-surface:
    name: IPC Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # C1 续(2026-10-20):两个 smoke 在 ubuntu runner 上直接起 Electron,
      # 需要虚拟显示 + 运行库(与 build-linux job 同一套依赖),否则
      # "Process failed to launch"。
      - name: Install Electron runtime deps (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # best-effort:moon 的原生二进制是 optionalDependency 平台包,缺失时
      # moon sync 会让 job 挂掉,而这两个 job 并不依赖 moon。
      - run: pnpm moon:sync || echo "::warning::moon sync 失败;该 job 不依赖 moon"
      # C1(2026-10-19 生产评审):两个 smoke 起的是真实 Electron(指向
      # dist/,package.json main)—— 本 job 此前没有构建步骤,在干净 runner
      # 上结构性无法通过(本机能过只是因为磁盘留着旧 dist/)。
      - run: pnpm exec electron-vite build
      - run: xvfb-run --auto-servernum -- pnpm test:electron:ipc-surface
      # surface-regression 断言窗口最大化/DevTools 翻转 —— headless CI 下
      # 窗口管理器不响应(实测三态全 false),属手动级探针而非门禁。
      - name: surface regression (non-gating)
        continue-on-error: true
        run: xvfb-run --auto-servernum -- pnpm test:electron:surface

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # B1(2026-10-19 生产评审):真实 API key 曾进过公开仓库历史。全量扫描
      # (fetch-depth: 0)拦住新增泄露;历史清洗另由轮换兜底。
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  perf-budget:
    name: Performance Budget Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # best-effort:moon 的原生二进制是 optionalDependency 平台包,缺失时
      # moon sync 会让 job 挂掉,而这两个 job 并不依赖 moon。
      - run: pnpm moon:sync || echo "::warning::moon sync 失败;该 job 不依赖 moon"
      - name: Build renderer
        run: pnpm exec electron-vite build
      - name: Verify bundle budgets
        # P3-01: CI gate that fails the PR if renderer entry/total exceeds
        # its measured budget, or any heavy chunk (markdown/katex/mermaid/cytoscape/
        # cynefin) leaks into the initial <link rel="modulepreload">.
        # Uses --strict so warnings become failures in CI.
        run: node scripts/perf/bundle-topology.mjs --strict
      - name: Verify main process chunks
        # Keep AgentHost and other heavy main-process capabilities out of the
        # startup entry while retaining Rollup-generated ESM chunks.
        run: pnpm run perf:main-chunks

  lint-tools:
    name: Lint (ESLint + Sheriff + Prettier)
    # A-7: report-only gate. ESLint and Sheriff rules are introduced in
    # "warn" mode and surfaced here as a per-PR annotation. Promoting
    # specific rules to "error" is tracked in the ts-error-architecture-
    # overhaul change plan; until then this job never blocks.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Sheriff module boundaries
        run: pnpm lint:sheriff || true
      - name: ESLint (report-only)
        # `--max-warnings 0` is intentionally NOT set: the codebase has
        # 539 `: any` and similar debts tracked for B-17 / B-11. We want
        # the trend line, not a hard fail.
        run: pnpm lint:eslint || true
      - name: Prettier (report-only)
        run: pnpm format:check || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            eslint-report.json
            prettier-report.txt
          retention-days: 14

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - name: Outdated
        run: pnpm outdated --format=json | tee outdated.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: outdated-report
          path: outdated.json
          retention-days: 30

  docs-link-check:
    name: Docs Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 这个 job 只跑一个 node 脚本，不需要依赖安装。
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 仓内 Markdown 相对链接门禁。
      #
      # 为什么不用 lychee-action：
      #   1. lychee 在本仓的失败退出码长期是 2（"用法/参数错误"），无法归因到
      #      具体哪条链接，改不动也修不掉；
      #   2. lychee 只报"链接坏了"，查不出"把作者本机绝对路径写进了文档"，
      #      而后者在本仓真实发生过（docs/analysis/*.md 里的 /Users/<某人>/...）；
      #   3. 本地也要能跑同一条门禁，否则"本地绿、CI 红"会一直重复出现。
      # 判定口径完全对齐原来的 `--offline --exclude-path THIRD-PARTY-NOTICES.md`：
      # 只校验仓内相对链接，第三方许可原文除外。
      - name: Check markdown links
        run: node scripts/check-doc-links.mjs

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [typecheck, test, storage-boundaries, ipc-surface, audit, docs-link-check, perf-budget, lint-tools]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "storage-boundaries: ${{ needs.storage-boundaries.result }}"
          echo "ipc-surface: ${{ needs.ipc-surface.result }}"
          echo "audit: ${{ needs.audit.result }}"
          echo "docs-link-check: ${{ needs.docs-link-check.result }}"
          echo "perf-budget: ${{ needs.perf-budget.result }}"
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.storage-boundaries.result }}" != "success" ] || \
             [ "${{ needs.ipc-surface.result }}" != "success" ] || \
             [ "${{ needs.perf-budget.result }}" != "success" ]; then
            exit 1
          fi
