    CreditWalletMember:
      type: object
      required: [walletId, tenantId, subject, role, createdAt, updatedAt, createdBy]
      properties:
        walletId: { type: string }
        tenantId: { type: string }
        subject: { type: string }
        role: { type: string, enum: [owner, spender, viewer] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
    CreditWalletCreateInput:
      type: object
      required: [name]
      properties:
        id: { type: string, pattern: "^[a-zA-Z0-9_.:-]{1,120}$" }
        name: { type: string, maxLength: 120 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 160 }
    BillingCallbackInput:
      type: object
      required: [orderNo, status]
      properties:
        orderNo: { type: string }
        status: { type: string, enum: [paid, failed, cancelled] }
        paymentId: { type: string, maxLength: 200, description: Required when status is paid; the same paymentId and channel cannot settle another order. }
        paymentChannel: { type: string, maxLength: 80, description: Required when status is paid; identifies the namespace in which paymentId is unique. }
        amountMinor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        failureReason: { type: string, maxLength: 240 }
  responses:
    PermissionDenied:
      description: Permission denied for the action
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string }
    VersionConflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string }
    TenantLifecyle:
      description: Tenant lifecycle blocks the operation
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string }
    WebhookUnauthorized:
      description: Webhook signature missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string }
    WebhookDisabled:
      description: Webhook receiver not configured
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string }
