        inputPointsPerThousand: { type: integer, minimum: 0 }
        outputPointsPerThousand: { type: integer, minimum: 0 }
        minimumPoints: { type: integer, minimum: 0 }
        inputCostPerMillion: { type: number, minimum: 0 }
        outputCostPerMillion: { type: number, minimum: 0 }
        costCurrency: { type: string, pattern: "^[A-Z]{3}$" }
