<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="320" viewBox="0 0 1480 320" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy wordmark v15.
    Left: 256x256 mark tile (same composition as openbuddy-logo.svg,
    scaled to 32px offset).
    Right: "OpenBuddy" wordmark + tagline. The "B" of "Buddy" is tinted
    warm amber to echo the companion sphere on the mark.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E2640"/>
      <stop offset="1" stop-color="#0B0F1E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset=".55" stop-color="#F5E6CC"/>
      <stop offset="1" stop-color="#D4A574"/>
    </linearGradient>
    <radialGradient id="spark" cx="35%" cy="35%" r="65%">
      <stop stop-color="#FFD78A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#F59E0B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="32" y="32" width="256" height="256" rx="58"/></clipPath>
  </defs>

  <!-- Mark tile (256x256) -->
  <g transform="translate(0 0)">
    <g clip-path="url(#clip)">
      <rect x="32" y="32" width="256" height="256" fill="url(#bg)"/>
      <circle cx="160" cy="160" r="96" fill="#F5E6CC" opacity=".04"/>
      <!-- 3/4 ring centered at (160,160), r=70 -->
      <path d="M 224.71 124.29 A 70 70 0 1 1 224.71 195.71"
            fill="none"
            stroke="url(#ring)"
            stroke-width="24"
            stroke-linecap="round"/>
      <circle cx="235" cy="104" r="32" fill="url(#sparkGlow)"/>
      <circle cx="235" cy="104" r="17" fill="url(#spark)"/>
      <circle cx="229" cy="98" r="5" fill="#FFFEF8" opacity=".55"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(338 0)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
    <text x="0" y="190" font-size="148" font-weight="700" letter-spacing="-4" fill="#1E2640">Open<tspan font-weight="700" fill="#F59E0B">Buddy</tspan></text>
    <text x="4" y="240" font-size="26" font-weight="500" letter-spacing="6" fill="#7A6E50">OPEN · ADAPTIVE · AI WORKBENCH</text>
  </g>
</svg>
