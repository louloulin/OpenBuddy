<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="320" viewBox="0 0 1480 320" role="img" aria-label="OpenBuddy">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop stop-color="#1B1838"/>
      <stop offset="1" stop-color="#070514"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8E5FF"/>
      <stop offset=".4" stop-color="#B8B4F8"/>
      <stop offset="1" stop-color="#5A5588"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9C95E8"/>
      <stop offset="1" stop-color="#3A356A"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7A75E0"/>
      <stop offset=".5" stop-color="#C0BFFF"/>
      <stop offset="1" stop-color="#E8E5FF"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32)">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
    <!-- antenna -->
    <line x1="128" y1="38" x2="128" y2="56" stroke="url(#panel)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="128" cy="36" r="6" fill="url(#visor)"/>
    <!-- ears -->
    <rect x="62" y="62" width="26" height="46" rx="8" fill="url(#panel)"/>
    <rect x="168" y="62" width="26" height="46" rx="8" fill="url(#panel)"/>
    <!-- head -->
    <rect x="66" y="62" width="124" height="124" rx="26" fill="url(#body)"/>
    <rect x="74" y="70" width="108" height="14" rx="5" fill="url(#panel)" opacity=".55"/>
    <!-- visor -->
    <rect x="78" y="106" width="100" height="28" rx="14" fill="url(#visor)"/>
    <circle cx="104" cy="120" r="11" fill="#0F0D24"/>
    <circle cx="152" cy="120" r="11" fill="#0F0D24"/>
    <circle cx="107" cy="117" r="3.5" fill="#FFFFFF"/>
    <circle cx="155" cy="117" r="3.5" fill="#FFFFFF"/>
    <!-- jaw -->
    <rect x="82" y="148" width="92" height="34" rx="14" fill="url(#panel)"/>
    <rect x="92" y="160" width="72" height="10" rx="3" fill="#0F0D24"/>
    <circle cx="128" cy="165" r="2" fill="#7BFFE0"/>
    <!-- joints -->
    <circle cx="92" cy="190" r="6" fill="url(#panel)"/>
    <circle cx="164" cy="190" r="6" fill="url(#panel)"/>
  </g>
  <g transform="translate(330 0)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
    <text x="0" y="190" font-size="148" font-weight="700" letter-spacing="-3" fill="#0F0D24">Open<tspan font-weight="700" fill="#7A75E0">Buddy</tspan></text>
    <text x="4" y="240" font-size="28" font-weight="500" letter-spacing="6" fill="#7A7BA0">OPEN · ADAPTIVE · AI WORKBENCH</text>
  </g>
</svg>
