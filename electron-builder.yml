appId: app.openbuddy.desktop
productName: OpenBuddy
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/@earendil-works/**/dist/**/*
  - node_modules/**/*.wasm
  - node_modules/**/*.node
  - node_modules/@silvia-odwyer/**/*
npmRebuild: false
# 内置 UpUp (20261127-upup §1.15)：vendor/upup 在 afterPack 里拷进 Resources/upup
# （extraResources 会丢掉 node_modules，见 apps/desktop/build-hooks/after-pack.cjs）。
afterPack: apps/desktop/build-hooks/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target: [dmg]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
win:
  icon: build/icon.ico
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
