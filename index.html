      Actual design tokens (--wb-*) live in src/styles/tokens.css, loaded from main.tsx.

      *::after {
        box-sizing: border-box;
      }

      html,
      body,

        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

        background-color: var(--wb-bg-primary, var(--vscode-editor-background, #ffffff));
        color: var(--wb-text-strong, var(--vscode-editor-foreground, #3b3b3b));

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        width: 10px;
        height: 10px;
      }

      }

          --vscode-scrollbarSlider-activeBackground,
          rgba(0, 0, 0, 0.6)
