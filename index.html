<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- P0.3(2026-10-19 生产评审 B6):渲染层 CSP。
         生产走 file://(loadFile),dev 走 vite server(electron-vite 配置里的
         csp-dev-relax 插件会在 dev 时放开 script unsafe-inline,供
         @vitejs/plugin-react 的 refresh preamble 使用)。file: 与 'self' 并列,
         因为 file:// 文档的 'self' 对 file: 子资源的匹配在 Chromium 里不可靠。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: https:; media-src 'self' file: data: blob: https:; font-src 'self' file: data:; connect-src 'self' file: ws: wss: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src 'self' file: data: blob: https:; worker-src 'self' file: blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./openbuddy-logo.svg" />
    <title>OpenBuddy</title>
    <!--
      Global base layer — ported from workbuddy/renderer/index.html.
      WorkBuddy injects VS Code theme variables from the host; here we hardcode
      the fallbacks so the page renders standalone in the Electron renderer.
      Actual design tokens (--wb-*) live in src/styles/tokens.css, loaded from main.tsx.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background-color: var(--wb-bg-primary, var(--vscode-editor-background, #ffffff));
        color: var(--wb-text-strong, var(--vscode-editor-foreground, #3b3b3b));
        font-family: var(
          --vscode-font-family,
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif
        );
        font-size: var(--vscode-font-size, 13px);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(
          --vscode-scrollbarSlider-background,
          rgba(100, 100, 100, 0.4)
        );
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(
          --vscode-scrollbarSlider-hoverBackground,
          rgba(100, 100, 100, 0.7)
        );
      }
      ::-webkit-scrollbar-thumb:active {
        background-color: var(
          --vscode-scrollbarSlider-activeBackground,
          rgba(0, 0, 0, 0.6)
        );
      }
    </style>
  </head>
  <body>
    <!-- R2.3 — skip-to-content link. Hidden until focused (via keyboard tab)
         so screen-reader / keyboard users can jump past the title bar and
         sidebar directly to the main conversation area. -->
    <a class="skip-to-content" href="#main-content">跳到主内容</a>
    <div id="root"></div>
    <!-- R4.3 — Node polyfill shim. Runs synchronously (non-module script)
         BEFORE main.tsx so the renderer has a `process` / `global`
         facade and a working `fileURLToPath` / `createRequire` shim
         before `@openbuddy/plugin-host` (which transitively pulls in
         `pi-coding-agent` → `which` → `cross-spawn`) evaluates. The
         shim values are no-ops for the renderer — it never shells out
         or resolves file URLs; main.tsx then runs the same logic in
         TypeScript so vite-bundled modules hit the same patched object. -->
    <!-- R4.3 shim 外置(见 public/node-shim.js);CSP 禁 inline script -->
    <script src="/node-shim.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
