<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy favicon v18 - tiny rendering of "Buddy the Whale".
    Brand palette only (cream / amber / ocean blue, no pure black).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A8DCF0"/>
      <stop offset="1" stop-color="#FFD09A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6FC0E8"/>
      <stop offset="1" stop-color="#1E5BA8"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset="1" stop-color="#FFB088"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset="1" stop-color="#FFE0C0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="64" height="64" fill="url(#bg)"/>

    <g transform="rotate(-7 32 36)">
      <path d="M 28 14 C 24 8, 38 4, 42 2 C 44 1, 45 2, 44 4 C 40 8, 36 12, 34 16 Z" fill="#F59E0B"/>
      <circle cx="42" cy="3" r="1.5" fill="#FFD78A"/>
      <circle cx="46" cy="6" r="1.2" fill="#FFD78A"/>

      <path d="M 31 50 Q 22 53 20 58 Q 22 58 26 56 Q 28 55 31 53 Z" fill="url(#body)"/>
      <path d="M 33 50 Q 42 53 44 58 Q 42 58 38 56 Q 36 55 33 53 Z" fill="url(#body)"/>

      <ellipse cx="32" cy="36" rx="20" ry="17" fill="url(#body)"/>
      <ellipse cx="32" cy="42" rx="14" ry="11" fill="url(#belly)"/>

      <g transform="rotate(-35 50 36)">
        <path d="M 46 30 C 54 28, 58 30, 58 33 C 58 36, 54 38, 50 38 C 46 38, 44 36, 44 34 C 44 32, 45 30, 46 30 Z" fill="url(#body)"/>
      </g>

      <circle cx="26" cy="32" r="3.5" fill="#FFFEF8"/>
      <circle cx="27" cy="33" r="2.4" fill="#1E2640"/>
      <circle cx="27.5" cy="32" r="0.8" fill="#FFFEF8"/>
      <path d="M 36 32 Q 39 36 42 32" stroke="#1E2640" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <ellipse cx="20" cy="40" rx="3" ry="1.6" fill="#FF7A6B" opacity=".55"/>
      <ellipse cx="44" cy="40" rx="3" ry="1.6" fill="#FF7A6B" opacity=".55"/>

      <path d="M 28 41 Q 28 45, 32 45.5 Q 36 45, 36 41 Q 36 44, 32 44 Q 28 44, 28 41 Z" fill="#FF6B6B"/>

      <g transform="rotate(8 32 18)">
        <ellipse cx="32" cy="22" rx="13" ry="1.6" fill="#1E4A78"/>
        <path d="M 22 22 C 22 15, 25 12, 32 12 C 39 12, 42 15, 42 22 Z" fill="url(#hat)"/>
        <path d="M 22 20 L 42 20 L 42 24 C 42 25, 41 25.5, 40 25.5 L 24 25.5 C 23 25.5, 22 25, 22 24 Z" fill="#1E2640"/>
        <circle cx="32" cy="23" r="1.4" fill="#FFD78A"/>
      </g>
    </g>
