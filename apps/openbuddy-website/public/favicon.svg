<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenBuddy">
  <!--
    Favicon: simplified badge. Drops bracket lines + outer ring dasharray so the
    silhouette stays crisp at 16/32/48 px.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E2A2A"/>
      <stop offset="1" stop-color="#06151A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5BFFD0"/>
      <stop offset="1" stop-color="#008C75"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7BFFE0"/>
      <stop offset="1" stop-color="#00C29A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ring)" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="12" fill="url(#core)"/>
  <circle cx="46" cy="20" r="3.2" fill="#FFFFFF"/>
</svg>
