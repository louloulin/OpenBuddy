    <text x="450" y="138" font-size="16" font-weight="700" fill="#bbf7d0">Capability Services</text>
    <text x="450" y="156" font-size="11" fill="#94a3b8">5 packages · the skill layer</text>

    <rect x="450" y="170" width="310" height="30" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="462" y="190" font-size="11" font-weight="700" fill="#e2e8f0">capability-authorization</text>

    <rect x="450" y="204" width="310" height="30" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="462" y="224" font-size="11" font-weight="700" fill="#e2e8f0">capability-calendar</text>

