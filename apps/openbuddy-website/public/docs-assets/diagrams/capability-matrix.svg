  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="32" font-weight="700" fill="#f8fafc">OpenBuddy Capability Matrix</text>
  <text x="800" y="80" text-anchor="middle" font-size="14" fill="#94a3b8">64 workspace packages · 8 capability groups · each individually enabled &amp; extended</text>

  <!-- ================= Group 1: Auth ================= -->
  <g>
    <rect x="60" y="110" width="350" height="180" rx="14" fill="url(#card)" stroke="#60a5fa"/>
    <text x="80" y="138" font-size="16" font-weight="700" fill="#bfdbfe">Auth &amp; Identity</text>
    <text x="80" y="156" font-size="11" fill="#94a3b8">2 packages</text>

    <rect x="80" y="170" width="310" height="36" rx="6" fill="#0f172a" stroke="#3b82f6"/>
    <text x="92" y="193" font-size="12" font-weight="700" fill="#e2e8f0">@openbuddy/auth-casdoor</text>
    <text x="378" y="193" text-anchor="end" font-size="10" fill="#60a5fa">OIDC · PKCE</text>

    <rect x="80" y="212" width="310" height="36" rx="6" fill="#0f172a" stroke="#3b82f6"/>
    <text x="92" y="235" font-size="12" font-weight="700" fill="#e2e8f0">@openbuddy/auth-permission</text>
    <text x="378" y="235" text-anchor="end" font-size="10" fill="#60a5fa">RBAC · scopes</text>
  </g>

