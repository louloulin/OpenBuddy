      <rect x="1000" y="200" width="160" height="26" rx="5" fill="#0f172a" stroke="#8b5cf6"/><text x="1010" y="218">network</text>
      <rect x="820" y="230" width="170" height="26" rx="5" fill="#0f172a" stroke="#8b5cf6"/><text x="830" y="248">policy</text>
      <rect x="1000" y="230" width="160" height="26" rx="5" fill="#0f172a" stroke="#8b5cf6"/><text x="1010" y="248">protocol</text>
      <rect x="820" y="260" width="170" height="26" rx="5" fill="#0f172a" stroke="#8b5cf6"/><text x="830" y="278">room</text>
      <rect x="1000" y="260" width="160" height="26" rx="5" fill="#0f172a" stroke="#8b5cf6"/><text x="1010" y="278">task</text>
    </g>
  </g>

