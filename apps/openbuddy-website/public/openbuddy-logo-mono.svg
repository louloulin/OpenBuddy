<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    Monochrome stencil variant. Solid silhouette with negative-space knockouts
    so the mark stays legible on any background. Recolour by changing the
    fill on the rect below (or inline + use currentColor).
  -->
  <defs>
    <mask id="mono" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFF"/>
      <!-- knockouts (subtract these) -->
      <circle cx="512" cy="512" r="292" fill="#000"/>
      <circle cx="512" cy="512" r="248" fill="#FFF"/>
      <circle cx="512" cy="512" r="198" fill="#000"/>
      <circle cx="700" cy="324" r="40" fill="#000"/>
      <rect x="232" y="232" width="48" height="176" fill="#000"/>
      <rect x="744" y="232" width="48" height="176" fill="#000"/>
      <rect x="232" y="616" width="48" height="176" fill="#000"/>
      <rect x="744" y="616" width="48" height="176" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="currentColor" mask="url(#mono)"/>
</svg>
