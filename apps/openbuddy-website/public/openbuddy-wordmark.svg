<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="320" viewBox="0 0 1480 320" role="img" aria-label="OpenBuddy">
  <!--
    Horizontal lockup: abstract badge mark + "OpenBuddy" wordmark.
    Type uses a system stack so it works without Inter installed.
    Mark is a downscaled version of the badge geometry.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E2A2A"/>
      <stop offset="1" stop-color="#06151A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5BFFD0"/>
      <stop offset=".55" stop-color="#00C29A"/>
      <stop offset="1" stop-color="#008C75"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7BFFE0"/>
      <stop offset="1" stop-color="#00C29A"/>
    </linearGradient>
  </defs>

  <!-- badge mark, 256x256, top-left aligned -->
  <g transform="translate(32 32)">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
    <circle cx="208" cy="56" r="96" fill="#00C29A" opacity=".10"/>
    <circle cx="56" cy="208" r="80" fill="#00C29A" opacity=".07"/>
    <circle cx="128" cy="128" r="82" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="460 50" stroke-dashoffset="55"/>
    <circle cx="128" cy="128" r="56" fill="none" stroke="#5BFFD0" stroke-width="6" opacity=".55"/>
    <circle cx="128" cy="128" r="34" fill="url(#core)"/>
    <circle cx="176" cy="82" r="11" fill="#FFFFFF"/>
    <path d="M66 66 L66 96" stroke="#5BFFD0" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <path d="M190 66 L190 96" stroke="#5BFFD0" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <path d="M66 190 L66 160" stroke="#5BFFD0" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <path d="M190 190 L190 160" stroke="#5BFFD0" stroke-width="4" stroke-linecap="round" opacity=".35"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(330 0)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
    <text x="0" y="190" font-size="148" font-weight="700" letter-spacing="-3" fill="#0B1F22">
      Open<tspan font-weight="700" fill="#00C29A">Buddy</tspan>
    </text>
    <text x="4" y="240" font-size="28" font-weight="500" letter-spacing="6" fill="#5C7A78">
      OPEN · ADAPTIVE · AI WORKBENCH
    </text>
  </g>
</svg>
