<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="320" viewBox="0 0 1480 320" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy wordmark v18.
    Left: 256x256 "Buddy the Whale" mark tile in the vivid sky palette
    (same composition as logo-mark.svg, scaled 0.25).
    Right: "OpenBuddy" wordmark + tagline. The "Buddy" tints warm amber
    to echo the spout spark in the mark. No pure black anywhere.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A8DCF0"/>
      <stop offset=".55" stop-color="#FFE5C2"/>
      <stop offset="1" stop-color="#FFD09A"/>
    </linearGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#6FC0E8"/>
      <stop offset=".45" stop-color="#2E78C8"/>
      <stop offset="1" stop-color="#1E5BA8"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset=".55" stop-color="#FFE0C0"/>
      <stop offset="1" stop-color="#FFB088"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset="1" stop-color="#FFE0C0"/>
    </linearGradient>
    <radialGradient id="spark" cx="35%" cy="35%" r="65%">
      <stop stop-color="#FFEFB0"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FF7A6B" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FF7A6B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="32" y="32" width="256" height="256" rx="58"/></clipPath>
  </defs>

  <!-- Mark tile (256x256) -->
  <g transform="translate(0 0)">
    <g clip-path="url(#clip)">
      <rect x="32" y="32" width="256" height="256" fill="url(#bg)"/>

      <g transform="rotate(-7 128 140)">
        <!-- spout -->
        <path d="M 120 56 C 115 38, 130 28, 150 18 C 160 13, 170 13, 165 23 C 155 33, 140 40, 130 55 Z" fill="url(#spark)"/>
        <circle cx="160" cy="20" r="2.5" fill="#FFD78A"/>
        <circle cx="175" cy="15" r="2" fill="#FFD78A"/>
        <circle cx="145" cy="13" r="2" fill="#FFD78A"/>
        <circle cx="183" cy="28" r="1.5" fill="#FFD78A"/>

        <!-- tail flukes -->
        <path d="M 125 192 Q 105 200 95 217 Q 95 220 103 217 Q 115 212 128 202 Z" fill="url(#body)"/>
        <path d="M 131 192 Q 151 200 161 217 Q 161 220 153 217 Q 141 212 128 202 Z" fill="url(#body)"/>

        <!-- main body -->
        <path d="M 128 60 C 174 60, 207 95, 207 140 C 207 185, 174 210, 128 210 C 82 210, 49 185, 49 140 C 49 95, 82 60, 128 60 Z" fill="url(#body)"/>

        <!-- left flipper -->
        <path d="M 60 145 C 50 150, 45 162, 50 172 C 55 180, 68 175, 74 165 C 79 158, 71 145, 60 145 Z" fill="url(#body)"/>

        <!-- raised (right) flipper waving -->
        <g transform="rotate(-35 197 150)">
          <path d="M 185 135 C 205 132, 218 135, 220 145 C 220 155, 210 160, 197 160 C 187 160, 180 155, 180 148 C 180 140, 182 136, 185 135 Z" fill="url(#body)"/>
        </g>

        <!-- belly -->
        <path d="M 128 120 C 158 120, 178 140, 178 172 C 178 200, 158 210, 128 210 C 98 210, 78 200, 78 172 C 78 140, 98 120, 128 120 Z" fill="url(#belly)"/>

        <!-- cheeks -->
        <ellipse cx="70"  cy="160" rx="15" ry="9" fill="url(#cheek)"/>
        <ellipse cx="186" cy="160" rx="15" ry="9" fill="url(#cheek)"/>

        <!-- left eye -->
        <ellipse cx="99" cy="128" rx="19" ry="24" fill="#FFFEF8"/>
        <ellipse cx="102" cy="132" rx="12" ry="17" fill="#1E2640"/>
        <circle cx="106" cy="124" r="5.5" fill="#FFFEF8"/>
        <circle cx="98" cy="139" r="2.8" fill="#FFFEF8"/>

        <!-- right eye (wink) -->
        <path d="M 145 128 Q 157 142 169 128" fill="none" stroke="#1E2640" stroke-width="4" stroke-linecap="round"/>
        <path d="M 169 128 l 3.5 -2" stroke="#1E2640" stroke-width="2" stroke-linecap="round"/>

        <!-- mouth -->
        <path d="M 115 160 Q 115 178, 128 180 Q 141 178, 141 160 Q 141 173, 128 173 Q 115 173, 115 160 Z" fill="#FF6B6B"/>
        <path d="M 121 170 Q 128 180, 135 170 Q 135 176, 128 176 Q 121 176, 121 170 Z" fill="#FF9A8B"/>

        <!-- captain's cap -->
        <g transform="rotate(8 128 62)">
          <ellipse cx="128" cy="73" rx="49" ry="5" fill="#1E4A78"/>
          <path d="M 98 73 C 98 56, 108 47, 128 47 C 148 47, 158 56, 158 73 Z" fill="url(#hat)"/>
          <path d="M 98 70 L 158 70 L 158 77 C 158 80, 156 81, 152 81 L 104 81 C 100 81, 98 80, 98 77 Z" fill="#1E2640"/>
          <g transform="translate(128 76)">
            <circle r="4" fill="#FFD78A"/>
            <path d="M 0 -2 L .5 -.5 L 2 -.5 L .8 .5 L 1.3 2 L 0 1 L -1.3 2 L -.8 .5 L -2 -.5 L -.5 -.5 Z" fill="#1E2640"/>
          </g>
        </g>
      </g>

      <!-- mini spark next to waving flipper -->
      <g transform="translate(200 60)" opacity=".95">
        <path d="M 0 -14 L 3 -9 L 9 -10 L 6 -5 L 13 -2 L 7 1 L 9 7 L 3 5 L 1 13 L -2 6 L -8 8 L -5 2 L -13 0 L -5 -2 L -8 -8 L -2 -7 Z" fill="#F59E0B"/>
      </g>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(338 0)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
    <text x="0" y="190" font-size="148" font-weight="700" letter-spacing="-4" fill="#1E5BA8">Open<tspan font-weight="700" fill="#F59E0B">Buddy</tspan></text>
    <text x="4" y="240" font-size="26" font-weight="500" letter-spacing="6" fill="#A05E2E">OPEN · ADAPTIVE · AI WORKBENCH</text>
  </g>
</svg>
