<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy Admin Portal">
  <!--
    OpenBuddy admin portal mark v18 - "Buddy the Whale".
    Sub-project tile that inherits the OpenBuddy brand identity.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A8DCF0"/>
      <stop offset=".55" stop-color="#FFE5C2"/>
      <stop offset="1" stop-color="#FFD09A"/>
    </linearGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#6FC0E8"/>
      <stop offset=".45" stop-color="#2E78C8"/>
      <stop offset="1" stop-color="#1E5BA8"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset=".55" stop-color="#FFE0C0"/>
      <stop offset="1" stop-color="#FFB088"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset="1" stop-color="#FFE0C0"/>
    </linearGradient>
    <radialGradient id="spark" cx="35%" cy="35%" r="65%">
      <stop stop-color="#FFEFB0"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FF7A6B" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FF7A6B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bg)"/>

    <!-- confetti -->
    <g fill="#F59E0B" opacity=".9">
      <path d="M 150 320 l 6 -22 l 6 22 l 22 6 l -22 6 l -6 22 l -6 -22 l -22 -6 z"/>
      <path d="M 880 380 l 5 -18 l 5 18 l 18 5 l -18 5 l -5 18 l -5 -18 l -18 -5 z"/>
    </g>

    <g transform="rotate(-7 512 540)">
      <!-- spout -->
      <g>
        <path d="M 478 200 C 460 150, 520 110, 600 70 C 640 50, 680 50, 660 90 C 620 130, 560 160, 520 220 Z" fill="url(#spark)"/>
        <circle cx="640" cy="80" r="10" fill="#FFD78A"/>
        <circle cx="700" cy="60" r="8" fill="#FFD78A"/>
        <circle cx="580" cy="50" r="7" fill="#FFD78A"/>
      </g>

      <!-- tail -->
      <path d="M 500 770 Q 420 800 380 870 Q 380 882 410 870 Q 460 850 510 810 Z" fill="url(#body)"/>
      <path d="M 524 770 Q 604 800 644 870 Q 644 882 614 870 Q 564 850 514 810 Z" fill="url(#body)"/>

      <!-- body -->
      <path d="M 512 240 C 696 240, 826 380, 826 560 C 826 740, 696 840, 512 840 C 328 840, 198 740, 198 560 C 198 380, 328 240, 512 240 Z" fill="url(#body)"/>

      <!-- raised flipper waving -->
      <g transform="rotate(-35 790 600)">
        <path d="M 740 540 C 820 530, 870 540, 880 580 C 880 620, 840 640, 790 640 C 750 640, 720 620, 720 590 C 720 560, 730 545, 740 540 Z" fill="url(#body)"/>
      </g>

      <!-- belly -->
      <path d="M 512 480 C 632 480, 712 560, 712 690 C 712 800, 632 840, 512 840 C 392 840, 312 800, 312 690 C 312 560, 392 480, 512 480 Z" fill="url(#belly)"/>

      <!-- cheeks -->
      <ellipse cx="278" cy="640" rx="60" ry="34" fill="url(#cheek)"/>
      <ellipse cx="746" cy="640" rx="60" ry="34" fill="url(#cheek)"/>

      <!-- left eye -->
      <ellipse cx="396" cy="510" rx="78" ry="98" fill="#FFFEF8"/>
      <ellipse cx="408" cy="530" rx="50" ry="68" fill="#1E2640"/>
      <circle cx="424" cy="496" r="22" fill="#FFFEF8"/>
      <circle cx="394" cy="556" r="11" fill="#FFFEF8"/>

      <!-- right wink -->
      <path d="M 580 510 Q 628 568 676 510" fill="none" stroke="#1E2640" stroke-width="16" stroke-linecap="round"/>
      <path d="M 676 510 l 14 -8" stroke="#1E2640" stroke-width="8" stroke-linecap="round"/>

      <!-- mouth -->
      <path d="M 462 640 Q 462 710, 512 720 Q 562 710, 562 640 Q 562 690, 512 690 Q 462 690, 462 640 Z" fill="#FF6B6B"/>
      <path d="M 484 678 Q 512 712, 540 678 Q 540 700, 512 700 Q 484 700, 484 678 Z" fill="#FF9A8B"/>
      <path d="M 502 642 L 502 656 L 510 656 L 510 642 Z" fill="#FFFEF8"/>

      <!-- cap -->
      <g transform="rotate(8 512 250)">
        <ellipse cx="512" cy="294" rx="194" ry="20" fill="#1E4A78"/>
        <path d="M 392 294 C 392 224, 432 188, 512 188 C 592 188, 632 224, 632 294 Z" fill="url(#hat)"/>
        <path d="M 392 280 L 632 280 L 632 308 C 632 318, 622 324, 608 324 L 416 324 C 402 324, 392 318, 392 308 Z" fill="#1E2640"/>
        <g transform="translate(512 302)">
          <circle r="15" fill="#FFD78A"/>
          <path d="M 0 -8 L 2 -2 L 8 -2 L 3 2 L 5 8 L 0 4 L -5 8 L -3 2 L -8 -2 L -2 -2 Z" fill="#1E2640"/>
        </g>
      </g>
    </g>

    <!-- "Admin" sub-label badge -->
    <g transform="translate(512 920)">
      <rect x="-180" y="-44" width="360" height="88" rx="44" fill="#FFFEF8"/>
      <text x="0" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" fill="#1E5BA8" letter-spacing="6">ADMIN</text>
    </g>
  </g>
</svg>
