[workspace]
resolver = "2"
members = [
    "openbuddy-host-core",
    "openbuddy-error-codes",
    "openbuddy-audit-types",
    "openbuddy-db",
    "openbuddy-ignore",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
authors = ["OpenBuddy Maintainers"]
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
ignore = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
base64 = "0.22"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
