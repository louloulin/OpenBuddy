language: typescript
layer: library
stack: unknown

tasks:
  typecheck:
    command: "tsc --noEmit"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "package.json"
    outputs: []

  test:
    command: "pnpm exec vitest run --passWithNoTests"
    inputs:
      - "src/**/*"
      - "package.json"
    outputs: []
    options:
      runInCI: true
