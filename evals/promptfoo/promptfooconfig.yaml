# Real promptfoo config driving OpenBuddy's Electron harness HTTP RPC.
# The provider below is implemented by a custom JS provider
# (evals/promptfoo/openbuddy_provider.js) that POSTs to /api/<method> with the
# harness bearer token and reads the Main-side agent.event-log RPC. The Python
# alternative under evals/inspect_ai shows
# the same flow against the same harness.
#
# Run:
#   OPENBUDDY_HARNESS_URL=http://127.0.0.1:PORT \
#   OPENBUDDY_HARNESS_TOKEN=secret \
#   OPENBUDDY_E2E_API_KEY=... OPENBUDDY_E2E_BASE_URL=https://api.minimaxi.com/anthropic \
#   OPENBUDDY_E2E_MODEL_ID=MiniMax-M3 OPENBUDDY_E2E_REQUIRED=1 \
#   npx promptfoo@latest eval -c evals/promptfoo/promptfooconfig.yaml
providers:
  - id: file://openbuddy_provider.js
    label: openbuddy-electron-harness

prompts:
  - id: zh-greet
    raw: |
      {{turn}}
  - id: context-recall
    raw: |
      {{turn}}

tests:
  - description: Chinese greeting marker
    vars:
      turn: "请只回复 CORE-GREET-ZH；不要解释。"
      marker: "CORE-GREET-ZH"
    assert:
      - type: javascript
        value: "output && output.includes(vars.marker)"
      - type: latency
        threshold: 60000

  - description: Two-turn context recall
    vars:
      turn: "基于上一条消息的 9031，只回复 CORE-CTX-B-9031；不要重新询问数字。"
      marker: "CORE-CTX-B-9031"
      turns: ["请只回复 CORE-CTX-A，并记住数字 9031；不要解释。", "基于上一条消息的 9031，只回复 CORE-CTX-B-9031；不要重新询问数字。"]
    assert:
      - type: javascript
        value: "output && output.includes(vars.marker)"
      - type: latency
        threshold: 90000

defaultTest:
  options:
    runSerially: true
