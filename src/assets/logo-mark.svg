<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy mark v15 - "Open Ring".
    A 3/4 circle (open ring) represents Open + openness/transparency.
    A small companion sphere floats just outside the gap, representing
    Buddy + the AI spark. Modern, geometric, scales cleanly from favicon
    to 1024px app icon.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E2640"/>
      <stop offset="1" stop-color="#0B0F1E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset=".55" stop-color="#F5E6CC"/>
      <stop offset="1" stop-color="#D4A574"/>
    </linearGradient>
    <radialGradient id="spark" cx="35%" cy="35%" r="65%">
      <stop stop-color="#FFD78A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#F59E0B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bg)"/>

    <!-- subtle warm wash for depth -->
    <circle cx="512" cy="512" r="360" fill="#F5E6CC" opacity=".04"/>
    <circle cx="512" cy="512" r="260" fill="#F5E6CC" opacity=".06"/>

    <!--
      Open ring: 3/4 of a circle. The arc starts at top-right (~-45deg)
      and sweeps 270deg clockwise, leaving a gap at the top-right where
      the companion sphere sits just outside.
      Stroke-linecap round gives the open ends a soft terminal.
    -->
    <path d="M 798.82 384.94 A 280 280 0 1 0 798.82 639.06"
          fill="none"
          stroke="url(#ring)"
          stroke-width="96"
          stroke-linecap="round"/>

    <!-- glow halo behind the companion sphere -->
    <circle cx="838" cy="298" r="120" fill="url(#sparkGlow)"/>

    <!-- companion sphere (the Buddy spark / AI companion) -->
    <circle cx="838" cy="298" r="68" fill="url(#spark)"/>
    <!-- specular highlight on the sphere -->
    <circle cx="816" cy="278" r="20" fill="#FFFEF8" opacity=".55"/>
  </g>
</svg>
