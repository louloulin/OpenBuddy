<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy mark v14 - cream abstract dog companion.
    Original organic dog silhouette on warm cream background. Single warm
    tan accent shape (no facial features). Inspired by reference color
    palette without copying any specific character.
  -->
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="50%" r="70%">
      <stop stop-color="#FCF7E9"/>
      <stop offset=".7" stop-color="#F5EBD3"/>
      <stop offset="1" stop-color="#E8D8B8"/>
    </radialGradient>
    <radialGradient id="body" cx="50%" cy="35%" r="70%">
      <stop stop-color="#FFFEF8"/>
      <stop offset=".55" stop-color="#FCF7E9"/>
      <stop offset="1" stop-color="#E8D8B8"/>
    </radialGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3D2A1A"/>
      <stop offset="1" stop-color="#1F140A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D4A574"/>
      <stop offset="1" stop-color="#9C7548"/>
    </linearGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bgRad)"/>

    <!-- decorative warm cream sparkles -->
    <circle cx="160" cy="180" r="4" fill="#D4A574" opacity=".4"/>
    <circle cx="860" cy="200" r="5" fill="#D4A574" opacity=".5"/>
    <circle cx="150" cy="850" r="3" fill="#9C7548" opacity=".35"/>
    <circle cx="880" cy="800" r="4" fill="#9C7548" opacity=".4"/>
    <circle cx="180" cy="500" r="2" fill="#D4A574" opacity=".3"/>
    <circle cx="840" cy="500" r="2" fill="#D4A574" opacity=".3"/>

    <!-- triangular ears -->
    <path d="M260 320 L240 184 Q244 168 268 172 L344 240 Z" fill="url(#body)" stroke="url(#outline)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M764 320 L784 184 Q780 168 756 172 L680 240 Z" fill="url(#body)" stroke="url(#outline)" stroke-width="14" stroke-linejoin="round"/>

    <!-- main head: rounded blob -->
    <path d="M512 240
             Q300 240 252 416
             Q224 540 312 596
             Q384 632 512 632
             Q640 632 712 596
             Q800 540 772 416
             Q724 240 512 240 Z"
          fill="url(#body)" stroke="url(#outline)" stroke-width="18" stroke-linejoin="round"/>

    <!-- snout (lower rounded chin area) -->
    <ellipse cx="512" cy="580" rx="160" ry="90" fill="url(#body)" stroke="url(#outline)" stroke-width="14"/>

    <!-- body: large rounded teardrop sitting posture -->
    <path d="M512 632
             Q260 632 220 800
             Q200 920 320 956
             Q420 980 512 980
             Q604 980 704 956
             Q824 920 804 800
             Q764 632 512 632 Z"
          fill="url(#body)" stroke="url(#outline)" stroke-width="18" stroke-linejoin="round"/>

    <!-- warm tan accent patch on chest/belly (the only "feature") -->
    <ellipse cx="512" cy="800" rx="140" ry="90" fill="url(#accent)" stroke="url(#outline)" stroke-width="14"/>
    <!-- inner darker oval for depth -->
    <ellipse cx="512" cy="800" rx="80" ry="50" fill="#9C7548" opacity=".45"/>

    <!-- ear inner detail: small tan triangles -->
    <path d="M280 320 L296 232 L324 268 Z" fill="url(#accent)" opacity=".85"/>
    <path d="M744 320 L728 232 L700 268 Z" fill="url(#accent)" opacity=".85"/>

    <!-- feet -->
    <ellipse cx="380" cy="970" rx="54" ry="22" fill="url(#body)" stroke="url(#outline)" stroke-width="14"/>
    <ellipse cx="644" cy="970" rx="54" ry="22" fill="url(#body)" stroke="url(#outline)" stroke-width="14"/>

    <!-- curved organic tail -->
    <path d="M792 760 Q860 720 880 660 Q886 624 858 620 Q836 624 832 660 Q824 700 760 720 Z"
          fill="url(#body)" stroke="url(#outline)" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
