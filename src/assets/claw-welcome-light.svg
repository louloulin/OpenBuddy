  <path d="M48 192 L48 160" stroke="#00C29A" stroke-width="3.5" stroke-linecap="round" opacity=".4"/>
  <path d="M192 192 L192 160" stroke="#00C29A" stroke-width="3.5" stroke-linecap="round" opacity=".4"/>
