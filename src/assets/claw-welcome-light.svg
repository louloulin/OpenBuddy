  <circle cx="120" cy="120" r="42" fill="url(#core)"/>
  <circle cx="162" cy="78" r="12" fill="#0B1F22"/>
  <path d="M48 48 L48 80" stroke="#00C29A" stroke-width="3.5" stroke-linecap="round" opacity=".4"/>
