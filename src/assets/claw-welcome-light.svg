<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="OpenBuddy">
  <!-- welcome-state hero mark: light bg variant of the abstract mark -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5BFFD0"/>
      <stop offset=".55" stop-color="#00C29A"/>
      <stop offset="1" stop-color="#008C75"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7BFFE0"/>
