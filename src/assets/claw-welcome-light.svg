<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy welcome graphic v15 - matches openbuddy-logo.svg.
    3/4 ring + companion sphere + soft cream backdrop. Used in welcome
    screens and onboarding surfaces.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop stop-color="#FFFEF8"/>
      <stop offset="1" stop-color="#F5E6CC"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E2640"/>
      <stop offset="1" stop-color="#3D4A6E"/>
    </linearGradient>
    <radialGradient id="spark" cx="35%" cy="35%" r="65%">
      <stop stop-color="#FFD78A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#F59E0B" stop-opacity=".25"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="240" height="240" fill="url(#bg)"/>

  <!-- decorative warm sparkles -->
  <circle cx="32" cy="38" r="2" fill="#D4A574" opacity=".5"/>
  <circle cx="210" cy="42" r="2.4" fill="#D4A574" opacity=".55"/>
  <circle cx="40" cy="200" r="1.6" fill="#9C7548" opacity=".4"/>
  <circle cx="200" cy="196" r="2" fill="#9C7548" opacity=".5"/>
  <circle cx="46" cy="118" r="1" fill="#D4A574" opacity=".4"/>
  <circle cx="198" cy="120" r="1" fill="#D4A574" opacity=".4"/>

  <!-- open ring centered, r=64 -->
  <path d="M 185.65 88.32 A 64 64 0 1 0 185.65 151.68"
        fill="none"
        stroke="url(#ring)"
        stroke-width="22"
        stroke-linecap="round"/>

  <!-- glow halo behind companion sphere -->
  <circle cx="194" cy="68" r="32" fill="url(#sparkGlow)"/>

  <!-- companion sphere -->
  <circle cx="194" cy="68" r="16" fill="url(#spark)"/>
  <circle cx="188" cy="62" r="4.5" fill="#FFFEF8" opacity=".55"/>
</svg>
