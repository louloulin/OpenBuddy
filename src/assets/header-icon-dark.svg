    OpenBuddy header icon (dark theme) v15.
    Same composition as header-icon.svg but tuned for dark surfaces:
    ring uses the warm cream gradient, sphere stays amber.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFEF8"/>
