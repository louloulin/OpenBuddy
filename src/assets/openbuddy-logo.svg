<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy mark v7 - cute robot pet companion.
    Round dome head, big luminous eyes (oversized for cute ratio), small
    heart-shaped antenna, soft chubby cheeks, gentle smile. No sharp angles,
    no industrial panels — friendly proportions throughout.
    Lavender + indigo + warm pink heart for the "buddy" warmth.
    Original character design using basic geometric primitives.
  -->
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="38%" r="70%">
      <stop stop-color="#26204E"/>
      <stop offset=".55" stop-color="#15123A"/>
      <stop offset="1" stop-color="#0A0820"/>
    </radialGradient>
    <radialGradient id="dome" cx="50%" cy="35%" r="65%">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#D6D3FF"/>
      <stop offset="1" stop-color="#7A75E0"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFB5D9" stop-opacity=".6"/>
      <stop stop-color="#FFB5D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C0BFFF"/>
      <stop offset="1" stop-color="#5A5588"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF8FBE"/>
      <stop offset="1" stop-color="#E84A8E"/>
    </linearGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bgRad)"/>
    <!-- soft sparkles -->
    <circle cx="160" cy="180" r="3" fill="#E8E5FF" opacity=".7"/>
    <circle cx="860" cy="160" r="4" fill="#E8E5FF" opacity=".75"/>
    <circle cx="120" cy="860" r="3" fill="#E8E5FF" opacity=".65"/>
    <circle cx="880" cy="880" r="3.5" fill="#E8E5FF" opacity=".7"/>
    <circle cx="200" cy="500" r="2.5" fill="#E8E5FF" opacity=".55"/>
    <circle cx="820" cy="500" r="2.5" fill="#E8E5FF" opacity=".55"/>

    <!-- heart antenna on top of dome -->
    <line x1="512" y1="170" x2="512" y2="244" stroke="#9C95E8" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(512 156)">
      <path d="M0 14 C-22 -10 -54 -10 -54 18 C-54 42 -22 60 0 84 C22 60 54 42 54 18 C54 -10 22 -10 0 14 Z" fill="url(#heart)" transform="scale(0.55)"/>
      <ellipse cx="-12" cy="-2" rx="10" ry="6" fill="#FFFFFF" opacity=".7"/>
    </g>

    <!-- dome head: a big rounded rectangle (no hard corners) -->
    <rect x="176" y="244" width="672" height="560" rx="280" fill="url(#dome)"/>

    <!-- soft shadow under dome -->
    <ellipse cx="512" cy="820" rx="320" ry="22" fill="#0F0D24" opacity=".35"/>

    <!-- cheek blush circles -->
    <circle cx="280" cy="600" r="56" fill="url(#cheek)"/>
    <circle cx="744" cy="600" r="56" fill="url(#cheek)"/>

    <!-- eye sockets (soft dark wells) -->
    <ellipse cx="400" cy="496" rx="106" ry="116" fill="#15123A"/>
    <ellipse cx="624" cy="496" rx="106" ry="116" fill="#15123A"/>

    <!-- glowing eye irises -->
    <circle cx="400" cy="500" r="86" fill="url(#eye)"/>
    <circle cx="624" cy="500" r="86" fill="url(#eye)"/>
    <!-- pupils (big, friendly) -->
    <circle cx="400" cy="510" r="48" fill="#15123A"/>
    <circle cx="624" cy="510" r="48" fill="#15123A"/>
    <!-- catchlight sparkles -->
    <ellipse cx="424" cy="486" rx="22" ry="26" fill="#FFFFFF"/>
    <ellipse cx="648" cy="486" rx="22" ry="26" fill="#FFFFFF"/>
    <circle cx="384" cy="528" r="10" fill="#FFFFFF" opacity=".8"/>
    <circle cx="608" cy="528" r="10" fill="#FFFFFF" opacity=".8"/>

    <!-- tiny smile -->
    <path d="M460 700 Q512 744 564 700" fill="none" stroke="#5A5588" stroke-width="18" stroke-linecap="round"/>

    <!-- little stubby side "ears" (rounded nubs, not panels) -->
    <ellipse cx="186" cy="380" rx="38" ry="64" fill="url(#dome)"/>
    <ellipse cx="838" cy="380" rx="38" ry="64" fill="url(#dome)"/>
    <ellipse cx="186" cy="380" rx="14" ry="32" fill="#FFB5D9" opacity=".7"/>
    <ellipse cx="838" cy="380" rx="14" ry="32" fill="#FFB5D9" opacity=".7"/>

    <!-- body hint: small rounded shoulder below dome -->
    <ellipse cx="512" cy="864" rx="200" ry="40" fill="url(#dome)" opacity=".7"/>

    <!-- sparkle accent -->
    <g transform="translate(810 240)">
      <circle r="14" fill="#FFFFFF"/>
      <circle r="26" fill="none" stroke="#C0BFFF" stroke-width="3" opacity=".55"/>
      <circle r="38" fill="none" stroke="#C0BFFF" stroke-width="1.5" opacity=".3"/>
    </g>
  </g>
</svg>
