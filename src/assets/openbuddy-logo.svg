<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy mark v3 - pure abstract.
    Composition: two interlocking geometric primitives (a circle + a square
    with rounded corners) symbolising Open + Buddy. The two shapes overlap
    to form a balanced, modern mark with no facial features, no animal forms.
    Brand palette: #00C29A core, #5BFFD0 highlight, #06151A shadow.
    Reads at 16px because the silhouette is just two interlocking shapes.
  -->
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="38%" r="70%">
      <stop stop-color="#0F3A36"/>
      <stop offset=".55" stop-color="#0B1F22"/>
      <stop offset="1" stop-color="#04101A"/>
    </radialGradient>
    <linearGradient id="ring" x1="120" y1="120" x2="900" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BFFE0"/>
      <stop offset=".5" stop-color="#00C29A"/>
      <stop offset="1" stop-color="#006B58"/>
    </linearGradient>
    <linearGradient id="block" x1="320" y1="320" x2="720" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BFFE0"/>
      <stop offset=".55" stop-color="#00C29A"/>
      <stop offset="1" stop-color="#005747"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7BFFE0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#00C29A" stop-opacity=".75"/>
    </linearGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bgRad)"/>
    <!-- ambient corner halos -->
    <circle cx="180" cy="180" r="280" fill="#00C29A" opacity=".10"/>
    <circle cx="860" cy="860" r="320" fill="#00C29A" opacity=".09"/>

    <!-- subtle grid lines (very low opacity) -->
    <line x1="148" y1="148" x2="876" y2="148" stroke="#5BFFD0" stroke-width="2" opacity=".08"/>
    <line x1="148" y1="876" x2="876" y2="876" stroke="#5BFFD0" stroke-width="2" opacity=".08"/>
    <line x1="148" y1="148" x2="148" y2="876" stroke="#5BFFD0" stroke-width="2" opacity=".08"/>
    <line x1="876" y1="148" x2="876" y2="876" stroke="#5BFFD0" stroke-width="2" opacity=".08"/>

    <!-- the "O" (Open) : outer ring -->
    <circle cx="420" cy="512" r="296" fill="none" stroke="url(#ring)" stroke-width="64"/>
    <!-- the "B" (Buddy) : rounded square offset right, overlapping -->
    <rect x="448" y="216" width="488" height="488" rx="120" fill="url(#block)"/>
    <!-- inner knockout reveals an "O" within the square -->
    <circle cx="692" cy="460" r="120" fill="#06151A"/>
    <circle cx="692" cy="460" r="120" fill="none" stroke="#5BFFD0" stroke-width="14" opacity=".8"/>
    <!-- second inner knockout lower-right -->
    <circle cx="692" cy="616" r="74" fill="#04101A"/>
    <circle cx="692" cy="616" r="74" fill="none" stroke="#7BFFE0" stroke-width="10" opacity=".7"/>

    <!-- thin accent ribbon : the "bridge" linking O + B -->
    <path d="M460 460 Q580 380 700 400" fill="none" stroke="url(#ribbon)" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    <path d="M460 564 Q580 644 700 624" fill="none" stroke="url(#ribbon)" stroke-width="10" stroke-linecap="round" opacity=".9"/>

    <!-- AI sparkle at upper right -->
    <g transform="translate(820 220)">
      <circle r="20" fill="#FFFFFF"/>
      <circle r="36" fill="none" stroke="#5BFFD0" stroke-width="4" opacity=".55"/>
      <circle r="54" fill="none" stroke="#5BFFD0" stroke-width="2" opacity=".25"/>
    </g>
  </g>
</svg>
