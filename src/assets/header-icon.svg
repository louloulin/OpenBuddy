<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy header icon v15 - matches openbuddy-logo.svg.
    Simplified open ring + companion sphere for tight UI spots.
    Sized for 16-32 px display; uses currentColor so the host theme
    controls the tint.
  -->
  <g fill="none">
    <!-- open ring: 3/4 circle, gap at top-right -->
    <path d="M 24.7 12.3 A 9 9 0 1 0 24.7 19.7"
          stroke="currentColor"
          stroke-width="3.2"
          stroke-linecap="round"/>
  </g>
  <!-- companion sphere -->
  <circle cx="26" cy="8.6" r="2.6" fill="#F59E0B"/>
</svg>
