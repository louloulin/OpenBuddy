<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    OpenBuddy mark v10 - ultra-minimal abstract.
    Composition: a single circle + a small inner ring + one accent dot.
    No characters, no faces, no limbs, no props — just three geometric
    primitives. Premium abstract identity.
    Palette: cream bg + brown ring + teal accent (v9 DNA kept as a hint).
  -->
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="50%" r="70%">
      <stop stop-color="#FFF7E8"/>
      <stop offset="1" stop-color="#E8D8B8"/>
    </radialGradient>
    <linearGradient id="ring" x1="280" y1="280" x2="744" y2="744" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D2A1A"/>
      <stop offset="1" stop-color="#1F140A"/>
    </linearGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bgRad)"/>
    <!-- the mark: one bold ring -->
    <circle cx="512" cy="512" r="280" fill="none" stroke="url(#ring)" stroke-width="48"/>
    <!-- inner thin ring (subtle layering) -->
    <circle cx="512" cy="512" r="200" fill="none" stroke="#3D2A1A" stroke-width="6" opacity=".25"/>
    <!-- single accent dot: teal AI signal, off-center for tension -->
    <circle cx="700" cy="324" r="36" fill="#09C8A7"/>
    <circle cx="700" cy="324" r="56" fill="none" stroke="#09C8A7" stroke-width="6" opacity=".5"/>
  </g>
</svg>
