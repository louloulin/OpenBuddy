<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenBuddy">
  <!--
    Abstract OpenBuddy mark.
    Composition: nested geometric forms on a rounded badge.
      - Outer ring  : openness, infinite loop
      - Inner ring  : focused intelligence / layer 2
      - Solid core  : the buddy / agent nucleus
      - Accent dot  : live signal / active inference
    Brand palette anchored on #00C29A (OpenBuddy mint-teal).
    Designed to survive 16px: the bold outer ring + solid core stay readable.
  -->
  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2A2A"/>
      <stop offset=".55" stop-color="#0B1F22"/>
      <stop offset="1" stop-color="#06151A"/>
    </linearGradient>
    <linearGradient id="ring" x1="320" y1="200" x2="720" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BFFD0"/>
      <stop offset=".45" stop-color="#00C29A"/>
      <stop offset="1" stop-color="#008C75"/>
    </linearGradient>
    <linearGradient id="core" x1="380" y1="380" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BFFE0"/>
      <stop offset="1" stop-color="#00C29A"/>
    </linearGradient>
    <clipPath id="clip"><rect x="38" y="38" width="948" height="948" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="38" y="38" width="948" height="948" fill="url(#bg)"/>

    <!-- soft glow to keep the badge from feeling flat -->
    <circle cx="780" cy="220" r="380" fill="#00C29A" opacity=".10"/>
    <circle cx="220" cy="820" r="320" fill="#00C29A" opacity=".07"/>

    <!-- outer ring : "Open" -->
    <circle cx="512" cy="512" r="320" fill="none" stroke="url(#ring)" stroke-width="56" stroke-linecap="round" stroke-dasharray="1820 200" stroke-dashoffset="220"/>

    <!-- inner ring : layered intelligence -->
    <circle cx="512" cy="512" r="220" fill="none" stroke="#5BFFD0" stroke-width="22" opacity=".55"/>

    <!-- core : the buddy / agent nucleus -->
    <circle cx="512" cy="512" r="132" fill="url(#core)"/>

    <!-- accent : live inference signal -->
    <circle cx="700" cy="324" r="44" fill="#FFFFFF"/>

    <!-- subtle bracket lines : framing the geometry (no literal animal) -->
    <path d="M256 256 L256 384" stroke="#5BFFD0" stroke-width="14" stroke-linecap="round" opacity=".35"/>
    <path d="M768 256 L768 384" stroke="#5BFFD0" stroke-width="14" stroke-linecap="round" opacity=".35"/>
    <path d="M256 768 L256 640" stroke="#5BFFD0" stroke-width="14" stroke-linecap="round" opacity=".35"/>
    <path d="M768 768 L768 640" stroke="#5BFFD0" stroke-width="14" stroke-linecap="round" opacity=".35"/>
  </g>
</svg>
